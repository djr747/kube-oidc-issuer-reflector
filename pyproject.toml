[build-system]
requires = ["setuptools>=82.0.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kube-oidc-issuer-reflector"
version = "1.0.0"
description = "A simple Python application for exposing Kubernetes' OIDC issuer metadata (discovery document and JWKS) anonymously outside the cluster."
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = { text = "MIT" }
authors = [
    { name = "Derek Robson", email = "djr747@users.noreply.github.com" },
]
keywords = ["kubernetes", "oidc", "issuer", "discovery", "jwks", "reflector"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet",
    "Topic :: System :: Systems Administration",
]

dependencies = [
    "kubernetes==36.0.3",
    "Flask==3.1.3",
    "gunicorn==26.0.0",
    "json_log_formatter==1.2.1",
    "flask_limiter==4.1.1",
    "flask_wtf==1.3.0",
    "setuptools>=83.0.0",
    "zipp>=4.1.0",
    "urllib3>=2.7.0",
    "requests>=2.34.2",
    "pyasn1>=0.6.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1,<10.0",
    "pytest-cov==7.1.0",
    "coverage>=7.15.2",
    "pytest-mock==3.15.1",
    "PyYAML==6.0.3",
    "ruff==0.16.0",
    "mypy==2.3.0",
    "pyright==1.1.411",
    "types-PyYAML==6.0.12.20260724",
    "tox==4.58.0",
]

[project.urls]
Homepage = "https://github.com/djr747/kube-oidc-issuer-reflector"
Repository = "https://github.com/djr747/kube-oidc-issuer-reflector"
Issues = "https://github.com/djr747/kube-oidc-issuer-reflector/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long, handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "S101"]

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
strict_equality = true
ignore_missing_imports = true

[tool.pyright]
include = ["app"]
exclude = ["**/.*", "**/__pycache__", "**/node_modules", ".venv", "venv", "build", "dist"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"
pythonPlatform = "All"
typeCheckingMode = "basic"
reportMissingImports = true
reportMissingTypeStubs = false
reportUnusedImport = true
reportUnusedVariable = true
reportDuplicateImport = true
reportCallIssue = false
reportArgumentType = false
reportReturnType = false
reportAttributeAccessIssue = false
reportGeneralTypeIssues = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--tb=short",
    "-m", "not integration",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests requiring a Kubernetes cluster",
]

[tool.coverage.run]
source = ["app"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true

[tool.coverage.xml]
output = "coverage.xml"
