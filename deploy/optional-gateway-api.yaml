# The referenced Gateway must already expose an HTTPS listener for the hostname.
# Its allowedRoutes policy must permit routes from this namespace.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kube-oidc-issuer-reflector
  namespace: kube-oidc-issuer-reflector
spec:
  parentRefs:
    - name: $GATEWAY_NAME
      namespace: $GATEWAY_NAMESPACE
      sectionName: $GATEWAY_LISTENER_NAME
  hostnames:
    - $OIDC_ISSUER_FQDN
  rules:
    - matches:
        - path:
            type: Exact
            value: /.well-known/openid-configuration
      backendRefs:
        - name: kube-oidc-issuer-reflector
          port: 80
    - matches:
        - path:
            type: Exact
            value: /openid/v1/jwks
      backendRefs:
        - name: kube-oidc-issuer-reflector
          port: 80
