name: Nightly Chainguard Python Version Check

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check-python-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: develop
      - id: version
        run: |
          docker pull cgr.dev/chainguard/python:latest
          echo "value=$(docker run --rm --entrypoint python cgr.dev/chainguard/python:latest -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')" >> "$GITHUB_OUTPUT"
      - id: change
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          CURRENT=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['requires-python'])")
          if [ "$CURRENT" = ">=$VERSION,<4" ]; then echo "needed=false" >> "$GITHUB_OUTPUT"; else echo "needed=true" >> "$GITHUB_OUTPUT"; fi
      - name: Update Python configuration
        if: steps.change.outputs.needed == 'true'
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          perl -0pi -e "s/requires-python = \">=[^\"]+\"/requires-python = \">=$VERSION,<4\"/" pyproject.toml
          perl -0pi -e "s/python_version = \"[0-9.]+\"/python_version = \"$VERSION\"/" pyproject.toml
          perl -0pi -e "s/pythonVersion = \"[0-9.]+\"/pythonVersion = \"$VERSION\"/" pyproject.toml
          perl -0pi -e "s/sonar\.python\.version=[0-9.]+/sonar.python.version=$VERSION/" sonar-project.properties
      - if: steps.change.outputs.needed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.0.0
        with:
          base: develop
          branch: chore/update-chainguard-python
          title: "chore: update Python version from Chainguard latest"
          commit-message: "chore: update Python version from Chainguard latest"
          body: "Updates Python constraints and CI runtime configuration to match Chainguard latest."
