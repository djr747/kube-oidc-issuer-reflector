name: Nightly Chainguard Python Version Check

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check-python-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
      - id: version
        run: |
          docker pull cgr.dev/chainguard/python:latest
          echo "value=$(docker run --rm --entrypoint python cgr.dev/chainguard/python:latest -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')" >> "$GITHUB_OUTPUT"
      - id: change
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          CURRENT=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['requires-python'])")
          NEXT_MINOR=$(python -c "major, minor = map(int, '$VERSION'.split('.')); print(f'{major}.{minor + 1}')")
          EXPECTED=">=$VERSION,<$NEXT_MINOR"
          if [ "$CURRENT" = "$EXPECTED" ]; then echo "needed=false" >> "$GITHUB_OUTPUT"; else echo "needed=true" >> "$GITHUB_OUTPUT"; fi
      - name: Update Python configuration
        if: steps.change.outputs.needed == 'true'
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          NEXT_MINOR=$(python -c "major, minor = map(int, '$VERSION'.split('.')); print(f'{major}.{minor + 1}')")
          TOX_VERSION=${VERSION/./}
          perl -0pi -e "s/requires-python = \">=[^\"]+\"/requires-python = \">=$VERSION,<$NEXT_MINOR\"/" pyproject.toml
          perl -0pi -e "s/python_version = \"[0-9.]+\"/python_version = \"$VERSION\"/" pyproject.toml
          perl -0pi -e "s/pythonVersion = \"[0-9.]+\"/pythonVersion = \"$VERSION\"/" pyproject.toml
          perl -0pi -e "s/target-version = \"py[0-9]+\"/target-version = \"py$TOX_VERSION\"/" pyproject.toml
          perl -0pi -e "s/Python :: [0-9]+\.[0-9]+/Python :: $VERSION/" pyproject.toml
          perl -0pi -e "s/PYTHON_VERSION: \"[0-9.]+\"/PYTHON_VERSION: \"$VERSION\"/" .github/workflows/ci.yml
          perl -0pi -e "s/python-version: '[0-9.]+'/python-version: '$VERSION'/g" .github/workflows/security.yml
          perl -0pi -e "s/envlist = py[0-9]+/envlist = py$TOX_VERSION/" tox.ini
          perl -0pi -e "s/Python [0-9.]+/Python $VERSION/g" docs/DEVELOPMENT.md
          perl -0pi -e "s/sonar\.python\.version=[0-9.]+/sonar.python.version=$VERSION/" sonar-project.properties
      - if: steps.change.outputs.needed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.0.0
        with:
          base: develop
          branch: chore/update-chainguard-python
          title: "chore: update Python version from Chainguard latest"
          commit-message: "chore: update Python version from Chainguard latest"
          body: "Updates Python constraints and CI runtime configuration to match Chainguard latest."
