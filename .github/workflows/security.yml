name: Security

on:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: python,actions
          queries: security-extended,security-and-quality
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - run: >-
          python -m pip install --only-binary=:all: --no-binary pyyaml '.[dev]'
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - run: >-
          python -m pip install --only-binary=:all: --no-binary pyyaml '.[dev]'
      - run: pip-audit --format json --output pip-audit.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: pip-audit
          path: pip-audit.json
          retention-days: 90

  container:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The base image lives in Docker's Hardened Images registry, which
      # requires a login to pull. Read-only Docker Hub credentials are
      # sufficient (pull scope only).
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKER_HUB_RO_USER }}
          password: ${{ secrets.DOCKER_HUB_RO_PAT }}
      - run: docker build -t kube-oidc-issuer-reflector:${{ github.sha }} .
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kube-oidc-issuer-reflector:${{ github.sha }}
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          # The DHI base is rebuilt and republished by Docker when security
          # fixes land; findings without an available fix cannot block a
          # build (there is no version we could upgrade to yet). Once a fix
          # is published, the floating base tag picks it up on the next
          # build and the finding becomes blocking again. All findings
          # (fixed and unfixed) are still uploaded to Code Scanning below.
          ignore-unfixed: true
          exit-code: '1'
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always()
        with:
          sarif_file: trivy.sarif
          category: trivy-container

  semgrep:
    # CI-only tool (not an app dependency), so it runs on the proven baseline
    # 1.177.0 + py3.14 that scans cleanly on the Azure Hosted Compute Agent
    # runner. (semgrep 1.180.0 + OCAMLRUNPARAM d=1 + `-j 1` crashes on that
    # runner: semgrep-core exits 1 with "Failure: failed to allocate domain" in
    # Eio_linux.Domain_mgr.run / Uring.exit, an io_uring domain-spawn
    # incompatibility with EIO's own domain scheduler. The 1.177.0 + py3.14
    # baseline keeps the scanner fully active; it reports real findings rather
    # than dying before the scan completes.)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - run: >-
          python -m pip install --only-binary=:all: semgrep==1.177.0 && semgrep scan --config p/default --error app/
