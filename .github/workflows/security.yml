name: Security

on:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: python,actions
          queries: security-extended,security-and-quality
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - run: >-
          python -m pip install --only-binary=:all: '.[dev]'
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - run: >-
          python -m pip install --only-binary=:all: '.[dev]'
      - run: pip-audit --format json --output pip-audit.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: pip-audit
          path: pip-audit.json
          retention-days: 90

  container:
    # Container vulnerability scan via Snyk, replacing the previous Trivy
    # image scan. Snyk's advisory data is pulled at scan time and, unlike
    # Trivy's Debian fix data, does not flip findings between fixed/unfixed
    # across DB snapshots, so the gate is deterministic against the DHI base
    # (whose OS packages are patched by Docker, not by this build). All
    # severities are reported to the step summary; only HIGH/CRITICAL block.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The base image lives in Docker's Hardened Images registry, which
      # requires a login to pull. Read-only Docker Hub credentials are
      # sufficient (pull scope only).
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKER_HUB_RO_USER }}
          password: ${{ secrets.DOCKER_HUB_RO_PAT }}
      - name: Build Docker image for scanning
        run: docker build -t kube-oidc-issuer-reflector:${{ github.sha }} .
      - name: Run Snyk container scan (SARIF)
        uses: snyk/actions/docker@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: kube-oidc-issuer-reflector:${{ github.sha }}
          command: test
          args: --sarif-file-output=snyk-container.sarif --json-file-output=snyk-container.json --severity-threshold=low
      - name: Normalize Snyk container SARIF
        if: always()
        run: |
          if [ -f snyk-container.sarif ]; then
            if jq 'walk(if type == "object" then with_entries(select(.key != "security-severity" or .value != null)) else . end)' \
              snyk-container.sarif > snyk-container.normalized.sarif; then
              mv snyk-container.normalized.sarif snyk-container.sarif
            else
              echo "Snyk SARIF normalization failed; preserving the original report"
              rm -f snyk-container.normalized.sarif
            fi
          fi
      - name: Upload Snyk container SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always()
        continue-on-error: true
        with:
          sarif_file: snyk-container.sarif
      - name: Upload Snyk JSON results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: snyk-container-json
          path: snyk-container.json
          retention-days: 90
      - name: Generate Snyk container summary
        if: always()
        run: |
          echo "### Snyk Container Vulnerability Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ ! -f snyk-container.json ]; then echo "No Snyk JSON output found" >> $GITHUB_STEP_SUMMARY; exit 0; fi
          CRITICAL=$(jq '[.. | .vulnerabilities? // [] | .[]? | select((.severity // "") | ascii_downcase=="critical")] | length' snyk-container.json)
          HIGH=$(jq '[.. | .vulnerabilities? // [] | .[]? | select((.severity // "") | ascii_downcase=="high")] | length' snyk-container.json)
          MEDIUM=$(jq '[.. | .vulnerabilities? // [] | .[]? | select((.severity // "") | ascii_downcase=="medium")] | length' snyk-container.json)
          LOW=$(jq '[.. | .vulnerabilities? // [] | .[]? | select((.severity // "") | ascii_downcase=="low")] | length' snyk-container.json)
          echo "| Severity | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🔴 Critical | $CRITICAL |" >> $GITHUB_STEP_SUMMARY
          echo "| 🟠 High | $HIGH |" >> $GITHUB_STEP_SUMMARY
          echo "| 🟡 Medium | $MEDIUM |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔵 Low | $LOW |" >> $GITHUB_STEP_SUMMARY
      - name: Enforce Snyk container vulnerability gate
        if: always()
        run: |
          if [ ! -s snyk-container.json ]; then
            echo "Snyk did not produce a readable JSON report"
            exit 1
          fi
          HIGH_OR_CRITICAL=$(jq '[.. | .vulnerabilities? // [] | .[]? | select((((.severity // "") | ascii_downcase) == "high") or (((.severity // "") | ascii_downcase) == "critical"))] | length' snyk-container.json)
          if [ "$HIGH_OR_CRITICAL" -gt 0 ]; then
            echo "Failing because Snyk found $HIGH_OR_CRITICAL high/critical vulnerabilities"
            exit 1
          fi

  semgrep:
    # CI-only tool (not an app dependency), so it runs on the proven baseline
    # 1.177.0 + py3.14 that scans cleanly on the Azure Hosted Compute Agent
    # runner. (semgrep 1.180.0 + OCAMLRUNPARAM d=1 + `-j 1` crashes on that
    # runner: semgrep-core exits 1 with "Failure: failed to allocate domain" in
    # Eio_linux.Domain_mgr.run / Uring.exit, an io_uring domain-spawn
    # incompatibility with EIO's own domain scheduler. The 1.177.0 + py3.14
    # baseline keeps the scanner fully active; it reports real findings rather
    # than dying before the scan completes.)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - run: >-
          python -m pip install --only-binary=:all: semgrep==1.177.0 && semgrep scan --config p/default --error app/
