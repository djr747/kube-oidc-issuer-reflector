# SonarCloud configuration for kube-oidc-issuer-reflector
sonar.organization=djr747
sonar.projectKey=djr747_kube-oidc-issuer-reflector
sonar.projectName=Kubernetes OIDC Issuer Reflector
sonar.language=py
sonar.sources=app
sonar.tests=tests
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.version=3.14
sonar.sourceEncoding=UTF-8

# Ignore hardcoded IP address warnings in test files only. Test data for the
# client-IP logic must use literal addresses (including private ranges), so
# the rule cannot be satisfied there.
sonar.issue.ignore.multicriteria=tc2,tc3
sonar.issue.ignore.multicriteria.tc2.ruleKey=python:S1313
sonar.issue.ignore.multicriteria.tc2.filePattern=**/tests/**
sonar.issue.ignore.multicriteria.tc2.resourceKey=**/tests/**
# Ignore insecure-HTTP usage warnings in test files only. The in-cluster
# service URL (http://<svc>.<ns>.svc.cluster.local) is the correct scheme
# for the service under test; TLS terminates at the API server, not the
# service.
sonar.issue.ignore.multicriteria.tc3.ruleKey=python:S5332
sonar.issue.ignore.multicriteria.tc3.filePattern=**/tests/**
sonar.issue.ignore.multicriteria.tc3.resourceKey=**/tests/**

# These block exclusions cover only the intentionally flagged dev-extra install
# commands in GitHub Actions. The rest of each workflow remains in analysis.
sonar.issue.ignore.block=devExtraInstall
sonar.issue.ignore.block.devExtraInstall.beginBlockRegexp=^\\s*# SONAR-IGNORE-BEGIN-DEV-INSTALL\\s*$
sonar.issue.ignore.block.devExtraInstall.endBlockRegexp=^\\s*# SONAR-IGNORE-END-DEV-INSTALL\\s*$
