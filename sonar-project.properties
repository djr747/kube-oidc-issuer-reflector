# SonarCloud configuration for kube-oidc-issuer-reflector
sonar.organization=djr747
sonar.projectKey=djr747_kube-oidc-issuer-reflector
sonar.projectName=Kubernetes OIDC Issuer Reflector
sonar.language=py
sonar.sources=app
sonar.tests=tests
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.version=3.14
sonar.sourceEncoding=UTF-8

# Ignore hard-coded credentials issues in test files only
sonar.issue.ignore.multicriteria=tc1,tc2,tc3,tc4,tc5,tc6,tc7
sonar.issue.ignore.multicriteria.tc1.ruleKey=python:S2068
sonar.issue.ignore.multicriteria.tc1.filePattern=**/tests/**
sonar.issue.ignore.multicriteria.tc1.resourceKey=**/tests/**
# Ignore hardcoded IP address warnings in test files only
sonar.issue.ignore.multicriteria.tc2.ruleKey=python:S1313
sonar.issue.ignore.multicriteria.tc2.filePattern=**/tests/**
sonar.issue.ignore.multicriteria.tc2.resourceKey=**/tests/**
# Ignore insecure-HTTP usage warnings in test files only
sonar.issue.ignore.multicriteria.tc3.ruleKey=python:S5332
sonar.issue.ignore.multicriteria.tc3.filePattern=**/tests/**
sonar.issue.ignore.multicriteria.tc3.resourceKey=**/tests/**
# Chainguard's public Python tags are floating so rebuilds receive security patches.
# Ignore only the specific-tag recommendation for this Dockerfile.
sonar.issue.ignore.multicriteria.tc4.ruleKey=docker:S6596
sonar.issue.ignore.multicriteria.tc4.filePattern=**/Dockerfile
sonar.issue.ignore.multicriteria.tc4.resourceKey=**/Dockerfile
# Dependencies are intentionally resolved from pyproject.toml without a committed lock file.
# Ignore only lock-file recommendations for the manifest, Docker build, and GitHub Actions installs.
sonar.issue.ignore.multicriteria.tc5.ruleKey=text:S8565
sonar.issue.ignore.multicriteria.tc5.filePattern=**/pyproject.toml
sonar.issue.ignore.multicriteria.tc5.resourceKey=**/pyproject.toml
sonar.issue.ignore.multicriteria.tc6.ruleKey=docker:S8544
sonar.issue.ignore.multicriteria.tc6.filePattern=**/Dockerfile
sonar.issue.ignore.multicriteria.tc6.resourceKey=**/Dockerfile
sonar.issue.ignore.multicriteria.tc7.ruleKey=githubactions:S8544
sonar.issue.ignore.multicriteria.tc7.filePattern=**/.github/workflows/**
sonar.issue.ignore.multicriteria.tc7.resourceKey=**/.github/workflows/**
