{{- if .Values.ingress.enabled }}
{{- $hosts := concat (list (required "ingress.host is required when ingress.enabled is true" .Values.ingress.host)) .Values.ingress.additionalHosts }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "kube-oidc-issuer-reflector.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kube-oidc-issuer-reflector.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  rules:
{{ range $host := $hosts }}
    - host: {{ $host | quote }}
      http:
        paths:
          - path: /.well-known/openid-configuration
            pathType: {{ $.Values.ingress.pathType }}
            backend:
              service:
                name: {{ include "kube-oidc-issuer-reflector.fullname" $ }}
                port:
                  number: {{ $.Values.service.port }}
          - path: /openid/v1/jwks
            pathType: {{ $.Values.ingress.pathType }}
            backend:
              service:
                name: {{ include "kube-oidc-issuer-reflector.fullname" $ }}
                port:
                  number: {{ $.Values.service.port }}
{{ end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
{{ range $host := $hosts }}
        - {{ $host | quote }}
{{ end }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
{{- end }}
