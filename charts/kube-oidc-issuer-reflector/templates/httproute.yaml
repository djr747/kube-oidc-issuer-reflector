{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "kube-oidc-issuer-reflector.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kube-oidc-issuer-reflector.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ required "gateway.name is required when gateway.enabled is true" .Values.gateway.name }}
      {{- with .Values.gateway.namespace }}
      namespace: {{ . }}
      {{- end }}
      {{- with .Values.gateway.sectionName }}
      sectionName: {{ . }}
      {{- end }}
  hostnames:
    - {{ required "gateway.host is required when gateway.enabled is true" .Values.gateway.host | quote }}
  rules:
    - matches:
        - path:
            type: Exact
            value: /.well-known/openid-configuration
      backendRefs:
        - name: {{ include "kube-oidc-issuer-reflector.fullname" . }}
          port: {{ .Values.service.port }}
    - matches:
        - path:
            type: Exact
            value: /openid/v1/jwks
      backendRefs:
        - name: {{ include "kube-oidc-issuer-reflector.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
