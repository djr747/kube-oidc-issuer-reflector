{{- if and .Values.ingress.enabled .Values.gateway.enabled }}
{{- fail "enable either ingress or gateway, not both" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kube-oidc-issuer-reflector.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kube-oidc-issuer-reflector.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  minReadySeconds: {{ .Values.minReadySeconds }}
  strategy:
    {{- toYaml .Values.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "kube-oidc-issuer-reflector.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- toYaml .Values.podAnnotations | nindent 8 }}
      labels:
        {{- include "kube-oidc-issuer-reflector.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "kube-oidc-issuer-reflector.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      enableServiceLinks: {{ .Values.enableServiceLinks }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: kube-oidc-issuer-reflector
          image: "{{ .Values.image.repository }}:{{ include "kube-oidc-issuer-reflector.imageTag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: DEFAULT_RATE_LIMIT
              value: {{ .Values.config.defaultRateLimit | quote }}
            - name: ALLOWED_USER_AGENT
              value: {{ .Values.config.allowedUserAgent | quote }}
            - name: KUBERNETES_REQUEST_TIMEOUT_SECONDS
              value: {{ .Values.config.kubernetesRequestTimeoutSeconds | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: GUNICORN_PROCESSES
              value: {{ .Values.config.gunicornProcesses | quote }}
            - name: GUNICORN_THREADS
              value: {{ .Values.config.gunicornThreads | quote }}
            - name: GUNICORN_TIMEOUT
              value: {{ .Values.config.gunicornTimeout | quote }}
            - name: OIDC_DOCUMENT_CACHE_TTL_SECONDS
              value: {{ .Values.oidcDocumentCache.ttlSeconds | quote }}
            - name: OIDC_DOCUMENT_CACHE_STALE_IF_ERROR_SECONDS
              value: {{ .Values.oidcDocumentCache.staleIfErrorSeconds | quote }}
            - name: OIDC_DOCUMENT_CACHE_ERROR_BACKOFF_SECONDS
              value: {{ .Values.oidcDocumentCache.errorBackoffSeconds | quote }}
            - name: OIDC_DOCUMENT_CACHE_MAX_DOCUMENT_BYTES
              value: {{ printf "%d" (int64 .Values.oidcDocumentCache.maxDocumentBytes) | quote }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.tmp.sizeLimit }}
