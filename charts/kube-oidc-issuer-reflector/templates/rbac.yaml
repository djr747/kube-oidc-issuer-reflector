{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kube-oidc-issuer-reflector.fullname" . }}-discovery
  labels:
    {{- include "kube-oidc-issuer-reflector.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:service-account-issuer-discovery
subjects:
  - kind: ServiceAccount
    name: {{ include "kube-oidc-issuer-reflector.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
