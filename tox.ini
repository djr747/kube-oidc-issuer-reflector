[tox]
envlist = py314
requires = tox >= 4.0

[testenv]
description = Run unit tests and produce coverage XML
package = skip
deps = .[dev]
install_command = python -m pip install --only-binary=:all: --no-binary pyyaml {opts} {packages}
skipsdist = True
commands =
    coverage run -m pytest tests/unit/ --junitxml=pytest-report.xml -q
    coverage xml -o coverage.xml
    coverage html -d coverage_html
    coverage report --fail-under=100
